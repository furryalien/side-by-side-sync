name: .NET CI

on:
  push:
    branches: [ "main", "initial-implementation" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/SideBySideSync/SideBySideSync.csproj

      - name: Build
        run: dotnet build src/SideBySideSync/SideBySideSync.csproj --configuration Release --no-restore

      - name: Test (if any)
        run: dotnet test --configuration Release --no-build
        continue-on-error: true
